name: Nightly

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prep:
    name: Prepare nightly release
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide + (re)create the rolling nightly release
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          git fetch --tags --force origin >/dev/null 2>&1 || true
          PREV=$(git rev-list -n1 nightly 2>/dev/null || echo none)

          # On the nightly cron, skip if master hasn't moved since the last nightly.
          if [ "$PREV" = "$HEAD_SHA" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "No new commits since last nightly ($SHORT); skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_build=true" >> "$GITHUB_OUTPUT"

          NOTES="Rolling nightly build from \`$SHORT\` — $(date -u '+%Y-%m-%d %H:%M UTC').

          Prerelease built from the tip of master; may be unstable. Get it with \`sdt update --nightly\`."

          gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
          gh release create nightly \
            --prerelease \
            --target "$HEAD_SHA" \
            --title "Nightly ($SHORT)" \
            --notes "$NOTES"

  build:
    name: Build ${{ matrix.asset }}
    needs: prep
    if: needs.prep.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            asset: sdt-macos-arm64
            os: macos
            zig: aarch64-macos
            build_args: -Dcpu=baseline
          - runner: macos-13
            asset: sdt-macos-x64
            os: macos
            zig: x86_64-macos
            build_args: -Dcpu=baseline
          - runner: ubuntu-latest
            asset: sdt-linux-x64
            os: linux
            zig: x86_64-linux
            build_args: -Dtarget=x86_64-linux-musl -Dcpu=baseline -Dstatic=true
          - runner: ubuntu-24.04-arm
            asset: sdt-linux-arm64
            os: linux
            zig: aarch64-linux
            build_args: -Dtarget=aarch64-linux-musl -Dcpu=baseline -Dstatic=true
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        run: |
          ZIG="zig-${{ matrix.zig }}-0.16.0"
          curl -fsSL "https://ziglang.org/download/0.16.0/${ZIG}.tar.xz" -o zig.tar.xz
          tar xf zig.tar.xz
          echo "$PWD/${ZIG}" >> "$GITHUB_PATH"

      - name: Build portable release binary
        run: zig build ${{ matrix.build_args }}

      - name: Verify Linux binary is static
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          file zig-out/bin/sdt
          if readelf -l zig-out/bin/sdt | grep -q 'INTERP'; then
            echo 'Linux nightly has a dynamic program interpreter' >&2
            exit 1
          fi
          if readelf -d zig-out/bin/sdt 2>/dev/null | grep -q 'NEEDED'; then
            echo 'Linux nightly has a dynamic library dependency' >&2
            exit 1
          fi
          zig-out/bin/sdt --version

      - name: Smoke-test HTTPS clone
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          zig-out/bin/sdt clone https://github.com/octocat/Hello-World.git "$smoke_dir/hello"
          test -d "$smoke_dir/hello/.git"
          test -f "$smoke_dir/hello/README"

      - name: Package binary
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          cp zig-out/bin/sdt "${ASSET}"
          chmod +x "${ASSET}"
          shasum -a 256 "${ASSET}" | awk '{print $1}' > "${ASSET}.sha256"

      - name: Upload to nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
